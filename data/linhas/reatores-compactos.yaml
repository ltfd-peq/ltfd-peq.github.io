id: reatores-compactos
titulo: Modelagem de reatores compactos
titulo_en: Compact reactor modeling
ordem: 5
ativa: true
icone: linha-reatores
chamada: "Reatores com membrana para hidrogênio e reatores para combustíveis de baixo carbono."   # uma frase, usada nos cards
resumo: >-
  Modelagem de reatores compactos em processos sustentáveis. Com o OpenFOAM®,
  avaliamos o efeito da geometria e das condições de operação sobre o desempenho de
  reatores com membrana para a produção de hidrogênio, na reforma a vapor do metano e
  na reforma autotérmica do etanol em reatores compactos. Para reatores de produção de
  combustíveis de baixo carbono, simulações numéricas diretas de sistemas reativos
  fornecem perfis médios usados para estimar os parâmetros de modelos unidimensionais e
  transientes, resolvidos pelo método dos volumes finitos.
topicos:
  - Reatores com membrana
  - Produção de hidrogênio
  - Combustíveis de baixo carbono
  - Reatores compactos
  - Estimação de parâmetros
