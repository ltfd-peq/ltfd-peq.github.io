# Frase do hero e descrição (PLANO §15, item 19: aprovar até 06/11).
# Base: resumo do Lattes de P. L. C. Lage e projeto CNPq "Termofluidodinâmica:
# Modelagem e Simulação de Escoamentos Complexos" (2016–atual); rascunho A, §8.1.
proposta: >-
  Estudamos escoamentos com transferência de calor e massa em equipamentos de
  processo, com ênfase em escoamentos multifásicos, balanço populacional, métodos
  numéricos e fluidodinâmica computacional (CFD) com o código aberto OpenFOAM®.
descricao: >-
  O LTFD, do Programa de Engenharia Química da COPPE/UFRJ, desenvolve estudos
  teóricos, experimentais e computacionais de escoamentos com transferência de
  calor e massa, com ênfase em escoamentos multifásicos, balanço populacional,
  métodos numéricos e CFD com OpenFOAM.
descricao_en: >-
  LTFD, at the Chemical Engineering Program of COPPE/UFRJ, carries out theoretical,
  experimental and computational research on flows with heat and mass transfer,
  focusing on multiphase flows, population balance modelling, numerical methods
  and CFD with OpenFOAM.

