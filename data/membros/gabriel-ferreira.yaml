bio: >-
  Engenheiro químico pela UFRJ (2012) e doutor em Engenharia Química pelo PEQ/COPPE/UFRJ
  (2018), com tese sobre simulação de escoamentos multifásicos com formação de hidratos,
  orientada por Paulo L. C. Lage. É professor do PEQ/COPPE desde 2020. Pesquisa formação
  de hidratos, CFD, métodos numéricos, balanço populacional e escoamentos multifásicos
  com transferência de calor e massa.
bio_en: >-
  Chemical Engineer (UFRJ, 2012) and D.Sc. in Chemical Engineering (PEQ/COPPE/UFRJ, 2018),
  with a thesis on simulating multiphase flows with hydrate formation, supervised by
  Paulo L. C. Lage. Faculty member of PEQ/COPPE since 2020, working on hydrate formation,
  CFD, numerical methods, population balance and multiphase flows with heat and mass transfer.
