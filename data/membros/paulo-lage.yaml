bio: >-
  Engenheiro químico pela UFRJ (1987), mestre (1988) e doutor (1992) em Engenharia
  Química pela COPPE/UFRJ, com estágio de pesquisa na University of California,
  Irvine. É professor do PEQ/COPPE desde 1993. Pesquisa escoamentos multifásicos em
  equipamentos de processo, balanço populacional, cristalização, métodos numéricos e
  CFD com OpenFOAM.
bio_en: >-
  Chemical Engineer (UFRJ, 1987), M.Sc. (1988) and D.Sc. (1992) in Chemical Engineering
  from COPPE/UFRJ, with a research stay at the University of California, Irvine. Faculty
  member of PEQ/COPPE since 1993, working on multiphase flows in process equipment,
  population balance, crystallization, numerical methods and CFD with OpenFOAM.
