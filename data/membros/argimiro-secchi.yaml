bio: >-
  Engenheiro químico pela UFRGS (1986), mestre (1988) e doutor (1992) em Engenharia
  Química pela COPPE/UFRJ, com doutorado sanduíche no Caltech. Professor Titular da UFRJ,
  pesquisa modelagem e simulação de processos, otimização dinâmica e controle não linear,
  com interfaces com a termofluidodinâmica em cristalização, escoamentos viscoelásticos
  e escoamento multifásico em dutos.
bio_en: >-
  Chemical Engineer (UFRGS, 1986), M.Sc. (1988) and D.Sc. (1992) in Chemical Engineering
  from COPPE/UFRJ, with a sandwich period at Caltech. Full Professor at UFRJ working on
  process modelling and simulation, dynamic optimization and nonlinear control, with
  interfaces with thermofluid dynamics in crystallization, viscoelastic flows and
  multiphase pipe flow.
